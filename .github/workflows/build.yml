name: Maven Build with GraalVM JDK 21

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo apt clean
          docker image ls -aq | xargs --no-run-if-empty docker rmi
          docker system prune -af
          echo "Available space"
          df -h

      - name: Print Github infos
        run: |
          echo "Github event name ${{ github.event_name }}"
          echo "Github Run ID ${{ github.run_id }}"
          echo "Output Run Number ${{ github.run_number }}"
          echo "Output Run Attempt ${{ github.run_attempt }}"
          echo "Output Base REF ${{ github.base_ref }}"
          echo "Output Job ${{ github.job }}"
          echo "Output Git REF ${{ github.ref_name }} / ${{ github.ref_type }}"

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: 'graalvm'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make Maven script executable
        run: chmod +x ./scripts/build_and_test.sh

      - name: Run Maven Build and Tests
        run: ./scripts/build_and_test.sh